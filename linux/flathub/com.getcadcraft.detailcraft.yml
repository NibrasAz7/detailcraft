id: com.getcadcraft.detailcraft
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: detailcraft
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: shell
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/shell/cargo
        CARGO_NET_OFFLINE: "true"
        TAURI_CONFIG: "{\"productName\":\"DetailCraft\",\"mainBinaryName\":\"detailcraft\",\"identifier\":\"com.getcadcraft.detailcraft\",\"version\":\"0.4.0\",\"bundle\":{\"icon\":[\"../com.getcadcraft.detailcraft-128.png\",\"../com.getcadcraft.detailcraft-512.png\"]}}"
    build-commands:
      - cd src-tauri && cargo --offline build --release --features tauri/custom-protocol
      - install -Dm755 src-tauri/target/release/cadcraft-desktop /app/bin/detailcraft
      - mkdir -p /app/lib/DetailCraft && cp -r edition /app/lib/DetailCraft/app
      - rm -f /app/lib/DetailCraft/app/.htaccess /app/lib/DetailCraft/app/web.config /app/lib/DetailCraft/app/INSTALL.md /app/lib/DetailCraft/app/sw.js
      - install -Dm644 shell.json /app/lib/DetailCraft/shell.json
      - install -Dm644 LICENSE /app/lib/DetailCraft/LICENSE
      - install -Dm644 THIRD_PARTY.md /app/lib/DetailCraft/THIRD_PARTY.md
      - install -Dm644 com.getcadcraft.detailcraft.desktop /app/share/applications/com.getcadcraft.detailcraft.desktop
      - install -Dm644 com.getcadcraft.detailcraft.metainfo.xml /app/share/metainfo/com.getcadcraft.detailcraft.metainfo.xml
      - install -Dm644 com.getcadcraft.detailcraft.svg /app/share/icons/hicolor/scalable/apps/com.getcadcraft.detailcraft.svg
      - install -Dm644 com.getcadcraft.detailcraft-64.png /app/share/icons/hicolor/64x64/apps/com.getcadcraft.detailcraft.png
      - install -Dm644 com.getcadcraft.detailcraft-128.png /app/share/icons/hicolor/128x128/apps/com.getcadcraft.detailcraft.png
      - install -Dm644 com.getcadcraft.detailcraft-256.png /app/share/icons/hicolor/256x256/apps/com.getcadcraft.detailcraft.png
      - install -Dm644 com.getcadcraft.detailcraft-512.png /app/share/icons/hicolor/512x512/apps/com.getcadcraft.detailcraft.png
      - install -Dm644 com.getcadcraft.detailcraft.mime.xml /app/share/mime/packages/com.getcadcraft.detailcraft.xml
    sources:
      - {"type":"git","url":"https://github.com/getcadcraft/desktop-shell.git","tag":"OWNER: shell release tag","commit":"OWNER: commit of that tag"}
